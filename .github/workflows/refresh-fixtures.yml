name: Refresh fixtures

# 04:00 UTC on Mondays. The hour is duplicated in the "Derive nominal slot" step
# below; changing one without the other makes every run report itself as late.
#
# Weekly rather than daily on purpose. openfootball publishes a whole season of
# schedules at once and amends them as rounds are rearranged, so the list changes
# on the scale of days, not hours. A daily rebuild would spend runner minutes and
# produce a commit that is usually empty.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

# These artifacts are derived, so a cancelled run loses nothing that cannot be
# rebuilt — but two runs writing the same parquet and racing to push would
# produce a pointless conflict. Queue instead.
concurrency:
  group: fixtures
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The full stack, not the serving subset: precomputing predictions runs the
      # fitted goal model, which is exactly what the deployed image excludes.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      # The boosters are gitignored (1.7 MB a run), so a fresh checkout has a
      # registry entry and no artifact to go with it. This used to retrain from
      # scratch every week -- 2.5 minutes rebuilding a model that had not changed
      # -- purely to get the file back. precompute_predictions.py now downloads
      # the published asset instead (Roadmap 10.1); retraining is retrain.yml, on
      # its own schedule, because it is a different question.

      # See flag-card.yml for why the slot is reconstructed here, and why only a
      # scheduled run gets one.
      - name: Derive nominal slot
        id: slot
        if: github.event_name == 'schedule'
        run: echo "at=$(date -u +%Y-%m-%dT04:00:00+00:00)" >> "$GITHUB_OUTPUT"

      # The date correction runs INSIDE this job, between the rebuild and the
      # precompute — see ops/jobs.py. Ordering it here instead would rebuild the
      # fixture list after correcting it and silently discard every correction.
      - name: Rebuild fixtures and predictions
        env:
          SLOT: ${{ steps.slot.outputs.at }}
          GH_TOKEN: ${{ github.token }}
          STATPITCH_API_FOOTBALL_KEY: ${{ secrets.STATPITCH_API_FOOTBALL_KEY }}
          STATPITCH_FOOTBALL_DATA_ORG_KEY: ${{ secrets.STATPITCH_FOOTBALL_DATA_ORG_KEY }}
          # The six cups nothing free reaches. /events costs no credits, so this
          # spends nothing; absent, those competitions simply have no fixtures.
          STATPITCH_ODDS_API_KEY: ${{ secrets.STATPITCH_ODDS_API_KEY }}
        run: python -m statpitch.ops.jobs refresh_fixtures ${SLOT:+--scheduled-for $SLOT}

      - name: Commit what changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every artifact the job writes. It used to list three, while
          # refresh_fixtures wrote seven — so each scheduled run produced a
          # capture of live odds, a rebuilt card and a fresh club map, and then
          # threw all three away. live_odds.parquet is append-only and its whole
          # value is the series, which meant the series could never start.
          paths="data/processed/fixtures.parquet                  data/processed/predictions.parquet                  data/processed/explanations.parquet                  data/processed/live_odds.parquet                  data/processed/fixture_odds_map.json                  data/processed/fixture_club_elo_map.json                  data/processed/card.parquet                  models/registry.json"
          if git diff --quiet -- $paths; then
            echo "fixtures and predictions unchanged; nothing to commit"
            exit 0
          fi
          git add $paths
          git commit -m "refresh_fixtures: $(date -u +%Y-%m-%d)"
          # A human may have pushed since checkout. Rebase rather than force.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            echo "push attempt ${attempt} lost a race; retrying"
            sleep $((attempt * 5))
          done
          echo "could not push after 3 attempts" >&2
          exit 1
