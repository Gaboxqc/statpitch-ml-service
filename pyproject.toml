[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statpitch"
version = "2.0.0.dev0"
description = "StatPitch v2 — calibrated club-football prediction and decision layer"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: statistical-power checks needing large simulated samples"]
filterwarnings = ["error::DeprecationWarning:statpitch.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture CSVs reproduce real football-data.co.uk headers, which run to 120
# columns. Wrapping them would stop them being faithful copies.
"tests/test_football_data.py" = ["E501"]
