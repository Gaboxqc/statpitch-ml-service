name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same branch has nothing to say, so cancel it. This is
# safe here precisely because CI writes nothing — the scheduled jobs, which do,
# set cancel-in-progress false.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests scripts

      # The suite is offline by design (NFR-5): no test touches the network, so
      # CI cannot be broken by a source going down, and a test that suddenly
      # needs a network call fails here rather than passing on a warm cache.
      - name: Test
        run: pytest
